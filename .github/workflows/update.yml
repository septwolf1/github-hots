name: Update GitHub Trending data

on:
  schedule:
    # UTC 时间：每天 00:07 = 北京时间 08:07
    # 注意：GitHub 的 cron 在整点高峰期会延迟，实测可能晚 5~20 分钟
    - cron: '7 0 * * *'
  workflow_dispatch: {} # 支持在 Actions 页面手动触发

permissions:
  contents: write # 需要写权限才能把抓取结果提交回仓库

concurrency:
  group: update-trending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch trending
        run: node scripts/fetch-trending.mjs

      - name: Translate descriptions to Chinese
        # 免密钥通道按 Bing → Google → MyMemory 自动降级
        # 下面配了 DeepSeek 后会直接走它，跳过所有免费通道（质量更好）
        # 失败不影响后续提交，只是保留英文原文
        continue-on-error: true
        env:
          TRANSLATE_BASE_URL: https://api.deepseek.com/v1
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: deepseek-chat
        run: node scripts/translate.mjs

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): update trending $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
