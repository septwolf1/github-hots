<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Trending 榜单</title>
<meta name="description" content="自动更新的 GitHub Trending 日榜 / 周榜 / 月榜">
<style>
  :root{
    --bg:#f7f7f5;
    --surface:#ffffff;
    --text:#1f1f1d;
    --text-2:#5f5e5a;
    --text-3:#8b8a85;
    --line:#e6e5e0;
    --accent:#185fa5;
    --accent-soft:#e6f1fb;
    --accent-mid:#85b7eb;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.65;
    -webkit-font-smoothing:antialiased;padding:40px 20px 64px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  header{margin-bottom:24px;}
  .eyebrow{
    display:inline-block;font-size:12px;letter-spacing:.08em;
    color:var(--accent);background:var(--accent-soft);
    padding:3px 10px;border-radius:999px;margin-bottom:14px;
  }
  h1{font-size:30px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px;}
  .sub{font-size:14px;color:var(--text-2);}
  .sub a{color:var(--accent);text-decoration:none;}

  .tabs{display:flex;gap:6px;margin:22px 0 24px;flex-wrap:wrap;}
  .tabs button{
    font:inherit;font-size:13.5px;cursor:pointer;
    background:var(--surface);color:var(--text-2);
    border:1px solid var(--line);border-radius:9px;
    padding:7px 18px;transition:.15s;
  }
  .tabs button:hover{color:var(--text);border-color:#d5d4ce;}
  .tabs button.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }

  .metrics{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;margin-bottom:24px;
  }
  .metric{
    background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:16px 18px;
  }
  .metric .label{font-size:12.5px;color:var(--text-3);margin-bottom:6px;}
  .metric .value{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.25;}
  .metric .value small{font-size:13px;font-weight:400;color:var(--text-2);margin-left:3px;}
  .metric .note{font-size:12px;color:var(--text-3);margin-top:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;
  }
  .card-head{
    padding:18px 22px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
  }
  .card-head h2{font-size:16px;font-weight:600;}
  .card-head span{font-size:12.5px;color:var(--text-3);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:12px;font-weight:500;color:var(--text-3);
    padding:10px 14px;border-bottom:1px solid var(--line);
    background:#fbfbf9;white-space:nowrap;
  }
  tbody td{padding:14px;border-bottom:1px solid #f1f0ec;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fbfbf9;}
  .rank{font-variant-numeric:tabular-nums;font-size:13px;color:var(--text-3);
    font-weight:500;width:44px;text-align:center;}
  tr.first .rank{color:var(--accent);}
  .repo{font-weight:500;white-space:nowrap;}
  .repo a{color:inherit;text-decoration:none;}
  .repo a:hover{color:var(--accent);text-decoration:underline;}
  .repo .owner{color:var(--text-3);font-weight:400;}
  .lang{display:inline-block;font-size:12px;color:var(--text-2);
    background:#f1f0ec;padding:2px 8px;border-radius:5px;white-space:nowrap;}
  .gain{min-width:150px;}
  .gain .num{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;
    color:var(--accent);margin-bottom:5px;}
  .bar{height:5px;background:#eeede8;border-radius:3px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--accent-mid);
    border-radius:3px;min-width:3px;}
  tr.first .bar i{background:var(--accent);}
  .total{font-variant-numeric:tabular-nums;color:var(--text-2);white-space:nowrap;}
  .desc{color:var(--text-2);font-size:13px;line-height:1.55;min-width:240px;}

  .notice{
    padding:32px 22px;text-align:center;font-size:13.5px;color:var(--text-2);
  }
  .notice strong{color:var(--text);}
  .notice code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;background:#eeede8;padding:1.5px 6px;border-radius:4px;color:#444441;
  }

  footer{
    margin-top:32px;padding-top:20px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--text-3);
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  footer a{color:var(--accent);text-decoration:none;}

  @media (max-width:820px){
    body{padding:24px 14px 48px;}
    h1{font-size:23px;}
    .desc{display:none;}
    thead th:nth-child(6),tbody td:nth-child(6){display:none;}
    .repo{white-space:normal;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">TRENDING BOARD</div>
    <h1>GitHub Trending 榜单</h1>
    <p class="sub">由 GitHub Actions 定时抓取并自动更新 ｜ 数据来源 <a href="https://github.com/trending">github.com/trending</a></p>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button data-since="daily" class="active" role="tab">今日</button>
    <button data-since="weekly" role="tab">本周</button>
    <button data-since="monthly" role="tab">本月</button>
  </nav>

  <section class="metrics" id="metrics"></section>

  <section class="card">
    <div class="card-head">
      <h2 id="cardTitle">今日榜单</h2>
      <span id="cardMeta">加载中…</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>项目</th>
          <th>语言</th>
          <th id="gainHead">今日新增</th>
          <th>总 star</th>
          <th>简介</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="notice" id="notice" hidden></div>
  </section>

  <footer>
    <span id="updatedAt">—</span>
    <span>数据每天更新一次 ｜ <a href="https://github.com/trending">原始页面</a></span>
  </footer>

</div>

<script>
(function () {
  'use strict';

  var LABEL = { daily: '今日', weekly: '本周', monthly: '本月' };
  var GAIN_HEAD = { daily: '今日新增', weekly: '本周新增', monthly: '本月新增' };
  var state = { since: 'daily', timer: null };

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmt(n) {
    return (Number(n) || 0).toLocaleString('zh-CN');
  }

  function timeAgo(iso) {
    if (!iso) return '—';
    var diff = Math.max(0, Date.now() - new Date(iso).getTime());
    var min = Math.floor(diff / 60000);
    if (min < 1) return '刚刚更新';
    if (min < 60) return min + ' 分钟前更新';
    var h = Math.floor(min / 60);
    if (h < 24) return h + ' 小时前更新';
    return Math.floor(h / 24) + ' 天前更新';
  }

  function showNotice(html) {
    var n = $('notice');
    n.innerHTML = html;
    n.hidden = false;
  }

  function clearNotice() {
    $('notice').hidden = true;
    $('notice').innerHTML = '';
  }

  function renderMetrics(items, since) {
    var total = items.reduce(function (s, i) { return s + i.gained; }, 0);
    var top = items[0];

    var langCount = {};
    items.forEach(function (i) {
      var k = i.language || '未知';
      langCount[k] = (langCount[k] || 0) + 1;
    });
    var langs = Object.keys(langCount)
      .sort(function (a, b) { return langCount[b] - langCount[a]; });

    var byStars = items.slice().sort(function (a, b) { return b.stars - a.stars; });

    var cards = [
      {
        label: LABEL[since] + '增长冠军',
        value: '+' + fmt(top.gained),
        unit: 'star',
        note: top.repo
      },
      {
        label: '合计新增',
        value: fmt(total),
        unit: 'star',
        note: '共 ' + items.length + ' 个项目，榜首占 ' +
          Math.round((top.gained / (total || 1)) * 100) + '%'
      },
      {
        label: '语言分布',
        value: langs.slice(0, 2).map(function (l) {
          return (l.length > 8 ? l.slice(0, 8) : l) + ' ' + langCount[l];
        }).join(' · '),
        unit: '',
        note: langs.slice(2, 5).map(function (l) {
          return l + ' ' + langCount[l];
        }).join(' · ') || '—'
      },
      {
        label: '总 star 最高',
        value: fmt(byStars[0].stars),
        unit: '',
        note: byStars[0].repo
      }
    ];

    $('metrics').innerHTML = cards.map(function (c) {
      return '<div class="metric">' +
        '<div class="label">' + esc(c.label) + '</div>' +
        '<div class="value">' + esc(c.value) +
          (c.unit ? '<small>' + esc(c.unit) + '</small>' : '') + '</div>' +
        '<div class="note" title="' + esc(c.note) + '">' + esc(c.note) + '</div>' +
      '</div>';
    }).join('');
  }

  function renderRows(items) {
    var max = Math.max.apply(null, items.map(function (i) { return i.gained; })) || 1;

    $('rows').innerHTML = items.map(function (it, idx) {
      var parts = it.repo.split('/');
      var pct = Math.max((it.gained / max) * 100, 0.4);
      return '<tr' + (idx === 0 ? ' class="first"' : '') + '>' +
        '<td class="rank">' + (it.rank || idx + 1) + '</td>' +
        '<td class="repo"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          '<span class="owner">' + esc(parts[0]) + ' /</span> ' + esc(parts[1] || '') +
        '</a></td>' +
        '<td>' + (it.language
          ? '<span class="lang">' + esc(it.language) + '</span>'
          : '<span class="lang">—</span>') + '</td>' +
        '<td class="gain"><div class="num">+' + fmt(it.gained) + '</div>' +
          '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div></td>' +
        '<td class="total">' + fmt(it.stars) + '</td>' +
        '<td class="desc" title="' + esc(it.description || '') + '">' +
          esc(it.descriptionZh || it.description || '—') + '</td>' +
      '</tr>';
    }).join('');
  }

  async function load(since) {
    state.since = since;
    $('gainHead').textContent = GAIN_HEAD[since];
    $('cardTitle').textContent = LABEL[since] + '榜单';
    $('cardMeta').textContent = '加载中…';
    $('rows').innerHTML = '';
    clearNotice();

    try {
      var res = await fetch('data/' + since + '.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();

      if (!data.items || !data.items.length) throw new Error('数据为空');

      renderMetrics(data.items, since);
      renderRows(data.items);

      $('cardMeta').textContent =
        '共 ' + data.items.length + ' 个项目 ｜ 抓取于 ' +
        new Date(data.generatedAt).toLocaleString('zh-CN', { hour12: false });
      $('updatedAt').textContent = timeAgo(data.generatedAt);
    } catch (err) {
      $('cardMeta').textContent = '暂无数据';
      $('metrics').innerHTML = '';
      showNotice(
        '<strong>' + LABEL[since] + '榜单还没有数据</strong><br>' +
        '如果这是刚部署的仓库，去 Actions 页面手动运行一次 ' +
        '<code>Update GitHub Trending data</code> 即可生成。<br>' +
        '<span style="color:#8b8a85;font-size:12.5px">错误信息：' + esc(err.message) + '</span>'
      );
    }
  }

  $('tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-since]');
    if (!btn) return;
    Array.prototype.forEach.call($('tabs').children, function (b) {
      b.classList.toggle('active', b === btn);
    });
    load(btn.dataset.since);
  });

  load('daily');

  // 每 30 分钟静默刷新当前周期（Actions 每天才更新，这里只是让页面别太旧）
  state.timer = setInterval(function () { load(state.since); }, 30 * 60 * 1000);
})();
</script>
</body>
</html>
